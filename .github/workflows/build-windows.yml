name: Build EzMouse (Windows portable)

# Builds a portable EzMouse folder for Windows and uploads it as a downloadable
# zip. Run it from the "Actions" tab ("Run workflow"), or push a tag like v0.1.0
# to also attach the zip to a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # GTK4 + libadwaita are built once and cached (first run is slow, ~1 hour;
      # later runs take a few minutes).
      - name: Create GTK dir (needed for cache restore)
        run: mkdir C:\gtk-build\gtk\x64\release
      - uses: actions/cache@v4
        id: cache
        with:
          path: c:/gtk-build/gtk/x64/release/**
          key: gtk-windows-build
          restore-keys: gtk-windows-build

      - name: Update path
        run: |
          echo "PKG_CONFIG=C:\gtk-build\gtk\x64\release\bin\pkgconf.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "C:\pkg-config-lite-0.28-1\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\gtk-build\gtk\x64\release\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build GTK (only when not cached)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          py -m venv .venv
          .venv\Scripts\activate.ps1
          # Pinned gvsbuild commit, same one upstream uses (includes a librsvg fix).
          py -m pip install git+https://github.com/wingtk/gvsbuild.git@6e67071890322a58d4d14ccd9fc4a61cc8494006
          # gvsbuild needs Git's bundled unix tools out of the way while building
          Move-Item "C:\Program Files\Git\usr\bin" "C:\Program Files\Git\usr\notbin"
          Move-Item "C:\Program Files\Git\bin" "C:\Program Files\Git\notbin"
          gvsbuild build --vs-ver vs2026 --msys-dir=C:\msys64 gtk4 libadwaita librsvg
          Move-Item "C:\Program Files\Git\usr\notbin" "C:\Program Files\Git\usr\bin"
          Move-Item "C:\Program Files\Git\notbin" "C:\Program Files\Git\bin"

      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Build EzMouse
        run: cargo build --release

      - name: Assemble portable folder
        run: |
          mkdir EzMouse
          Get-ChildItem -Path "C:\gtk-build\gtk\x64\release\bin\*.dll" -File -Recurse | Copy-Item -Destination EzMouse
          Copy-Item target\release\ezmouse.exe EzMouse
          Copy-Item packaging\README-PORTABLE.txt EzMouse\README.txt
          Copy-Item LICENSE, NOTICE EzMouse
          Compress-Archive -Path EzMouse -DestinationPath EzMouse-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EzMouse-windows-x86_64
          path: EzMouse-windows-x86_64.zip

      - name: Attach to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" EzMouse-windows-x86_64.zip --generate-notes --repo "$env:GITHUB_REPOSITORY"
